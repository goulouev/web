<SCRIPT language=VBScript>
dim br,pi,Ao,Bo,Ac,Bc,Sc,inu
pi=3.141592653589
br=chr(13)&chr(10)
inu=0

sub helper(index)
msgbox index
end sub

sub proc(index)
if index=1 then
msgbox "Enter end points of operational frequency range of your filter."  
end if
if index=2 then
msgbox "Enter end points of frequency ranges to be rejected by filter." 
end if
if index=3 then
msgbox "Enter filter interface dimensions Ao (width) and Bo (height)."&br&br&" Those are dimensions of external rectangular waveguide line to be connected to filter." 
end if
if index=4 then 
F0=intF0.value
F1=intF1.value
F2=intF2.value
F3=intF3.value
Ao= intAo.value
Bo=intBo.value
msgbox Fmode(1,0)
end if
end sub

function cf
if unit(0).checked=true then cf=.0209579 else cf=.532331
end function

function Fmode(n,m)
kc=sqr((pi/Ac)^2+(pi/Bc)^2)
Fmode=fc*kc
end function
