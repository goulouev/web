        function run_onclick() {
            if (!ValidStrucForms()) {
                return;
            }
            var Ao, Bo, At, Bt, Xt, Ac, Bc, Sc;
            var Dc = [], Hc = [], br, So = [], Nc, wK = [];
            var nUnit, br = "\r\n";
            //var unit = document.getElementsByName('unit');

            ExportFormsToStruc();
            var sDatos = "";
            var i, f, Np = 200;
            for (i = 0; i <= Struc.Np; i++) {
                if (Np === 0) { f = Struc.F0; } else { f = Struc.F0 + (Struc.F1 - Struc.F0) * i / Struc.Np; }
                var k = Struc.cfunit * f;
                So = hu000(k, Struc.Ao, Struc.Bo, Struc.At, Struc.Bt, Struc.Xt, Struc.Nc, Struc.Ac, Struc.Bc, Struc.Sc, Struc.Dc, Struc.Hc);
                var RdB = dB([So[0], So[1]]), TdB = dB([So[2], So[3]]);
                sDatos = sDatos + f + ' ' + So.join(" ") + "\r\n";
            }
            sessionStorage.setItem('sDatSim', sDatos);
            sessionStorage.setItem("StrucBufer", Struc.ExportBufer());
        }

        function ValidStrucForms() {
            V = WordsToArray(document.getElementById('text0').value);
            if (areNumbers(V) < 1) {
                alert(" 'Input/Output' section not complete.");
                return false;
            }
            V = WordsToArray(document.getElementById('text1').value);
            if (areNumbers(V) < 2) {
                alert(" 'Transformer section' not complete.");
                return false;
            }
            V = WordsToArray(document.getElementById('text2').value);
            if (areNumbers(V) < 2) {
                alert(" Corrugations Parameters (Ac, Bc, Dc) \n not complete/specified.");
                return false;
            }
            if (!ValidCorros(document.getElementById('text3').value)) {
                return false;
            }
            V = WordsToArray(document.getElementById('text4').value);
            if (areNumbers(V) < 1) {
                alert(" 'Simulation Frequency' section not complete.");
                return false;
            }
            return true;
            function ValidCorros(txt) {
                if (!txt) { alert('No corrugations specified\nSee "Example" as example.'); return false; }
                var LNs = txt.replace("\r", "").split("\n");
                var i, ii = -1;
                var Ncc = LNs.length - 1;
                for (i = 0; i <= Ncc; i++) {
                    if (trim(LNs[i]) !== "") {
                        V = WordsToArray(LNs[i]);
                        if (areNumbers(V) === 1) {
                            ii = ii + 1;
                        } else {
                            alert('Wrong dada record in Corrugations\n' + (ii + 2) + ' row');
                            return false;
                        }
                    }
                }
                if (ii === -1) {
                    alert('No corrugations specified\nSee "Example" as example.')
                    return false;
                }
                return true;
            }
        }

        function ExportFormsToStruc() {
            var units = document.getElementsByName('unit');
            if (units[0].checked) { Struc.ind = 0; } else { Struc.ind = 1; }
            V = WordsToArray(document.getElementById('text0').value);
            Struc.Ao = parseFloat(V[0]); Struc.Bo = parseFloat(V[1]);
            V = WordsToArray(document.getElementById('text1').value);
            Struc.At = parseFloat(V[0]); Struc.Bt = parseFloat(V[1]); Struc.Xt = parseFloat(V[2]);
            V = WordsToArray(document.getElementById('text2').value);
            Struc.Ac = parseFloat(V[0]); Struc.Bc = parseFloat(V[1]); Struc.Sc = parseFloat(V[2]);
            Struc.ImportCorros(document.getElementById('text3').value);
            V = WordsToArray(document.getElementById('text4').value);
            Struc.F0 = parseFloat(V[0]); Struc.F1 = parseFloat(V[1]);
            if (areNumbers(V) > 1) { Struc.Np = parseInt(V[2]); }
            Struc.setUnit();
        }

        function ExportStrucToForms(dat) {
            var units = document.getElementsByName('unit');
            //var i, LN = "";
            //Struc.setUnit();
            if (Struc.ind === 0) { units[0].checked = true; } else { units[1].checked = true; }
            document.getElementById('text0').value = Struc.Ao.toFixed(Struc.nUnit) + "      " + Struc.Bo.toFixed(Struc.nUnit);
            document.getElementById('text1').value = Struc.At.toFixed(Struc.nUnit) + "    " + Struc.Bt.toFixed(Struc.nUnit) + "    " + Struc.Xt.toFixed(Struc.nUnit);
            document.getElementById('text2').value = Struc.Ac.toFixed(Struc.nUnit) + "    " + Struc.Bc.toFixed(Struc.nUnit) + "    " + Struc.Sc.toFixed(Struc.nUnit);
            document.getElementById('text3').value = Struc.ExportCorros();//LN;
            document.getElementById('text4').value = Struc.F0.toFixed(4) + "   " + Struc.F1.toFixed(4);
        }

        function areNumbers(V) {
            if (!Array.isArray) {
                Array.isArray = function (arg) {
                    return Object.prototype.toString.call(arg) === '[object Array]';
                };
            } if (!Array.isArray(V)) { return -1; }
            var i, N = V.length - 1;
            for (i = 0; i <= N; i++) {
                if (isNaN(V[i])) { return -1; }
            }
            return N;
        }

        function WordsToArray(str) {
            // text line to array of words
            return ReduceWhiteSpaces(str).split(/\s/g);
        }

        function ReduceWhiteSpaces(str) {
            return trim(str).replace(/\s+/g, ' ');
        }
        function trim(str) {
            return str.replace(/^\s+|\s+$/g, '');
        }
