        function SetProject(LNs) {
            //document.getElementById('FileProjectOkno').value = localStorage.getItem('ProjectDat');
            var i, key;
            var SetupDat = '';
            var DesignDat = '';
            var MemoDat = '';
            var kod = -1;
            var n = LNs.length - 1;
            if (n < 0) { return;}
                for (i = 0; i <= n; i++) {
                    var LN = LNs[i].trim();
                    if (LN.length > 3) {
                        key = LNs[i].substr(0, 4);
                        //alert(key);
                        if (key == 'SETU') { kod = 1; }
                        if (key == 'DESI') { kod = 2; }
                        if (key == 'BACK') { kod = 3; }
                        if (kod == 1 && key != 'SETU') {
                            SetupDat += LNs[i] + '\r\n';
                        }
                        if (kod == 2 && key != 'DESI') {
                            DesignDat += LNs[i] + '\r\n';
                        }
                        if (kod == 3 && key != 'BACK') {
                            MemoDat += LNs[i] + '\r\n';
                        }

                    }

                }
            if (kod > 0) {
                localStorage.setItem("InputDatFileText", SetupDat);
                localStorage.setItem("DesignFileText", DesignDat);
                localStorage.setItem("MemoDatText", MemoDat);
                window.location.href = 'editor.htm';
            }
        }
        //############################

        function ConvertJS() {
            var txt = document.getElementById('FileProjectOkno').value;
            var scrpt = "function PrjFile(){\r\n";
            scrpt = scrpt + "var rs=[];\r\n";
            var ii = -1;
            if (txt != '') {
                var LNs = txt.match(/[^\r\n]+/g);
                var n = LNs.length - 1;
                for (i = 0; i <= n; i++) {
                    var LN = LNs[i].trim();
                    if (LN) {
                        ii = ii + 1;
                        scrpt = scrpt + "rs["+ii+"]='"+LN+"';\r\n";
                    }
                }
            }
            scrpt = scrpt = scrpt + "SetProject(rs);\r\n"
            //scrpt = scrpt = scrpt + "return rs;\r\n";
            scrpt = scrpt = scrpt + "}\r\n";
            document.getElementById('FileProjectOkno').value=scrpt;
        }


        document.getElementById('fileToLoad').onchange = function (event) {
            var fileToLoad = event.target.files[0];
            if (fileToLoad) {
                var reader = new FileReader();
                reader.onload = function (fileLoadedEvent) {
                    var textFromFileLoaded = fileLoadedEvent.target.result;
                    //document.getElementById('FileProjectOkno').value = textFromFileLoaded;
                    document.getElementById('FileProjectOkno').value = textFromFileLoaded;
                };
                reader.readAsText(fileToLoad, 'UTF-8');
            }
        };

        function saveDynamicDataToFile() {

            var userInput = document.getElementById("FileProjectOkno").value;

            var blob = new Blob([userInput], { type: "text/plain;charset=utf-8" });
            saveAs(blob, "design.txt");
        }
