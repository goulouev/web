    <script type="text/javascript">
        var ErrStatus = 0;

            GetFromDataForms();
        }

        function SetUpLoad() {
            //if (localStorage.getItem('ProjectDat') === null) {

        function SetUpUnload() {
            ReadForms();

        function ReadForms() {
            var InDat = new SetUpDat();
            ErrStatus = 0;
            var texto = "";
            if (document.getElementById('SetMM').checked) {
                InDat.iUnit = 0;
            } else {
                InDat.iUnit = 1;
            }
            if (document.getElementById('SetFmin').value) { InDat.f0 = DoubleVal('SetFmin'); }
            if (document.getElementById('SetFmax').value) { InDat.f1 = DoubleVal('SetFmax'); }
            if (document.getElementById('SetNp').value) { InDat.Np = IntVal('SetNp'); }
            //Synthesis
            if (document.getElementById('SetFc').value) { InDat.Fc = DoubleVal('SetFc'); }
            if (document.getElementById('SetBW').value) { InDat.dF = DoubleVal('SetBW'); }
            if (document.getElementById('SetAtt').value) { InDat.Att = DoubleVal('SetAtt'); }
            if (document.getElementById('SetButter').checked) { InDat.IndFilter = 0; }
            if (document.getElementById('SetCheb').checked) { InDat.IndFilter = 1; }
            if (document.getElementById('SetTaper').checked) { InDat.IndFilter = 2; }
            if (document.getElementById('SetB0').value) { InDat.Bstrt = DoubleVal('SetB0'); }
            if (document.getElementById('SetBc').value) { InDat.Bcntr = DoubleVal('SetBc'); }
            if (document.getElementById('SetB1').value) { InDat.Bend = DoubleVal('SetB1'); }
            if (document.getElementById('SetAlfa').value) { InDat.alfa = DoubleVal('SetAlfa'); }
            //DoubleVal('SetAlfa');
            //InDat.alfa = document.getElementById('SetAlfa').value;
            if (document.getElementById('SetResoCnst').checked) { InDat.CnstNode = 1; } else { InDat.CnstNode = 0;}
            if (document.getElementById('SetResoNum').value) { InDat.ResoNum = DoubleVal('SetResoNum'); }
            if (document.getElementById('SetMini').checked) { InDat.OptType = 0; }
            if (document.getElementById('SetL2').checked) { InDat.OptType = 1; }
            if (document.getElementById('SetOptSteps').value) { InDat.Nopt = IntVal('SetOptSteps'); }
            if (document.getElementById('SetOptDmin').value) { InDat.Wmin = DoubleVal('SetOptDmin'); }
            if (document.getElementById('SetOptCmin').value) { InDat.Cmin = DoubleVal('SetOptCmin'); }
            if (document.getElementById('SetOptDx').value) { InDat.dX = DoubleVal('SetOptDx'); }
            var InText = document.getElementById('SetOptSpecs').value;
            if (!InText) {
                InDat.Nspec = -1;
                localStorage.setItem('InputDatFileText', InDat.ExportToText());
                return;
            }
            var InDatLines = InText.match(/[^\r\n]+/g);
            var OptErr = Array.isArray(InDatLines);
            if (ErrStatus === 2) { return; }
            var n = InDatLines.length - 1;
            var i;
            var iii = -1;

            for (i = 0; i <= n; i++) {
                var ShrtLine = InDatLines[i].trim();
                if (ShrtLine) {
                    iii = iii + 1;
                    var vs = WordsToArray(ShrtLine);

                    var i0 = parseInt(vs[0]);
                    var i1 = parseInt(vs[1]);
                    var f0 = parseFloat(vs[2]);
                    var f1 = parseFloat(vs[3]);
                    var Tr = parseFloat(vs[4]);
                    var Np = parseInt(vs[5]);
                    InDat.OptSpecs[iii] = [i0, i1, f0, f1, Tr, Np];
                    InDat.Nspec = iii;
                    //InDat.OptSpecs[iii] = vs;
                    //InDat.Nspec = iii;
                }
            }
            ErrStatus = 0;
            localStorage.setItem('InputDatFileText', InDat.ExportToText());
            return;
        }

        function WriteForms() {
            var InDatText = localStorage.getItem('InputDatFileText');
            if (!InDatText) { return; }
            if (InDatText.trim) {
                var InDat = new SetUpDat();
                InDat.ImportFromText(InDatText);
                if (InDat.iUnit === 0) {
                    document.getElementById('SetMM').checked = true;
                    document.getElementById('SetIn').checked = false;
                } else {
                    document.getElementById('SetMM').checked = false;
                    document.getElementById('SetIn').checked = true;
                }
                //Simulation
                document.getElementById('SetFmin').value = InDat.f0;
                document.getElementById('SetFmax').value = InDat.f1;
                document.getElementById('SetNp').value = InDat.Np;
                //Synthesis
                document.getElementById('SetFc').value = InDat.Fc;
                document.getElementById('SetBW').value = InDat.dF;
                document.getElementById('SetAtt').value = InDat.Att;
                var iFilter = parseInt(InDat.IndFilter, 10);
                switch (iFilter) {
                    case 0:
                        document.getElementById('SetButter').checked = true;
                        document.getElementById('SetCheb').checked = false;
                        document.getElementById('SetTaper').checked = false;
                        break;
                    case 1:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = true;
                        document.getElementById('SetTaper').checked = false;
                        break;
                    case 2:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = false;
                        document.getElementById('SetTaper').checked = true;
                        break;
                    default:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = true;
                        document.getElementById('SetTaper').checked = false;
                }
                if (InDat.CnstNode === 1) {
                    document.getElementById('SetResoCnst').checked = true;
                } else {
                    document.getElementById('SetResoSynth').checked = true;
                }

                document.getElementById('SetB0').value = InDat.Bstrt;
                document.getElementById('SetBc').value = InDat.Bcntr;
                document.getElementById('SetB1').value = InDat.Bend;
                document.getElementById('SetAlfa').value = InDat.alfa;
                document.getElementById('SetResoNum').value = InDat.ResoNum;
                // Optimization < br /> <br />
                var iOpter = parseInt(InDat.OptType, 10);
                if (iOpter === 0) {
                    document.getElementById('SetMini').checked = true;
                    document.getElementById('SetL2').checked = false;
                } else {
                    document.getElementById('SetMini').checked = false;
                    document.getElementById('SetL2').checked = true;
                }
                document.getElementById('SetOptSteps').value = InDat.Nopt;
                document.getElementById('SetOptDmin').value = InDat.Wmin;
                document.getElementById('SetOptCmin').value = InDat.Cmin;
                document.getElementById('SetOptDx').value = InDat.dX;
                var texto = "";
                for (i = 0; i <= InDat.Nspec; i++) {
                    texto = texto + InDat.OptSpecs[i].join(" ") + "\r\n";
                    //texto = texto + InDat.OptSpecs[i].join(" ") + "<br/>";
                }
                //document.getElementById('SetOptSpecs').value = texto;
                document.getElementById('SetOptSpecs').value = texto;
            }

        }

        function SetInDataForms(InDatText) {
            if (InDatText.trim) {
                var InDat = new SetUpDat();
                InDat.ImportFromText(InDatText);
                if (InDat.iUnit === "0") {
                    document.getElementById('SetMM').checked = true;
                    document.getElementById('SetIn').checked = false;
                } else {
                    document.getElementById('SetMM').checked = false;
                    document.getElementById('SetIn').checked = true;
                }
                //Simulation
                document.getElementById('SetFmin').value = InDat.f0;
                document.getElementById('SetFmax').value = InDat.f1;
                document.getElementById('SetNp').value = InDat.Np;
                //Synthesis
                document.getElementById('SetFc').value = InDat.Fc;
                document.getElementById('SetBW').value = InDat.dF;
                document.getElementById('SetAtt').value = InDat.Att;
                var iFilter = parseInt(InDat.IndFilter, 10);
                switch (iFilter) {
                    case 0:
                        document.getElementById('SetButter').checked = true;
                        document.getElementById('SetCheb').checked = false;
                        document.getElementById('SetTaper').checked = false;
                        break;
                    case 1:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = true;
                        document.getElementById('SetTaper').checked = false;
                        break;
                    case 2:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = false;
                        document.getElementById('SetTaper').checked = true;
                        break;
                    default:
                        document.getElementById('SetButter').checked = false;
                        document.getElementById('SetCheb').checked = true;
                        document.getElementById('SetTaper').checked = false;
                }

                document.getElementById('SetB0').value = InDat.Bstrt;
                document.getElementById('SetBc').value = InDat.Bcntr;
                document.getElementById('SetB1').value = InDat.Bend;
                document.getElementById('SetAlfa').value = InDat.alfa;
                document.getElementById('SetResoNum').value = InDat.ResoNum;
                // Optimization < br /> <br />
                var iOpter = parseInt(InDat.OptType, 10);
                if (iOpter === 0) {
                    document.getElementById('SetMini').checked = true;
                    document.getElementById('SetL2').checked = false;
                } else {
                    document.getElementById('SetMini').checked = false;
                    document.getElementById('SetL2').checked = true;
                }
                document.getElementById('SetOptSteps').value = InDat.Nopt;
                document.getElementById('SetOptDmin').value = InDat.Wmin;
                document.getElementById('SetOptCmin').value = InDat.Cmin;
                document.getElementById('SetOptDx').value = InDat.dX;
                var texto = "";
                for (i = 0; i <= InDat.Nspec; i++) {
                    texto = texto + InDat.OptSpecs[i].join(" ") + "\r\n";
                    //texto = texto + InDat.OptSpecs[i].join(" ") + "<br/>";
                }
                //document.getElementById('SetOptSpecs').value = texto;
                document.getElementById('SetOptSpecs').value = texto;
            }
        }

        //######################  FILE OPEN #######################################################
        function loadFileAsText() {
            var fileToLoad = document.getElementById("fileToLoad").files[0];

            var fileReader = new FileReader();
            fileReader.onload = function (fileLoadedEvent) {
                var textFromFileLoaded = fileLoadedEvent.target.result;
                document.getElementById("FileProjectOkno").value = textFromFileLoaded;
            };
            fileReader.readAsText(fileToLoad, "UTF-8");
        }

    </script>
