        function WriteVars(V) {
            var i, iv, ii = -1;
            var Nv = V.length - 1;
            var iX = MainSchema.iSymX * MainSchema.iSymX;
            var iY = MainSchema.iSymY * MainSchema.iSymY;
            var iZ = MainSchema.iSymZ;
            nVars = VarMap.length - 1;
            for (iv = 0; iv <= nVars; iv++) {
                i = VarMap[iv][0];
                var iVar = VarMap[iv][1];
                switch (iVar) {
                    case -5:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[3] = -V[ii];
                        MainSchema.juncs[i].v[5] = V[ii];
                        break;
                    case -4:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[2] = -V[ii];
                        MainSchema.juncs[i].v[4] = V[ii];
                        break;
                    case -3:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[3] = V[ii];
                        MainSchema.juncs[i].v[5] = -V[ii];
                        break;
                    case -2:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[2] = V[ii];
                        MainSchema.juncs[i].v[4] = -V[ii];
                        break;
                    case 1:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[1] = V[ii];
                        break;
                    case 2:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[2] = V[ii];
                        if (iX === 1) { MainSchema.juncs[i].v[4] = -V[ii];}
                        break;
                    case 3:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[3] = V[ii];
                        if (iY === 1) { MainSchema.juncs[i].v[5] = -V[ii]; }
                        break;
                    case 4:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[4] = V[ii];
                        if (iX === 1) { MainSchema.juncs[i].v[2] = -V[ii]; }
                        break;
                    case 5:
                        ii = ii + 1;
                        MainSchema.juncs[i].v[5] = V[ii];
                        if (iY === 1) { MainSchema.juncs[i].v[3] = -V[ii]; }
                        break;
                }
            }
            if (iZ === 1 && MainSchema.IsSymZ) { MainSchema.FixSymZ();}
            return V;
        }

        function ReadVars() {
            var i, iv, iVar, iMark, ii = -1;
            var V = [];
            nVars = VarMap.length - 1;
            for (iv = 0; iv <= nVars; iv++) {
                i = VarMap[iv][0]; iMark = VarMap[iv][1]; iVar = Math.abs(iMark);
                if (IsValidVar(iMark)) {
                    ii = ii + 1;
                    V[ii] = MainSchema.juncs[i].v[iVar];
                }
            }
            return V;
        }
        function IsValidVar(iVar) {
            iv = Math.abs(iVar);
            if (iv === 2 || iv === 3 || iv === 4 || iv === 5) { return true; }
            if (iv === 1) { return true; }
            return false;
        }
        function GetVarMap(schema) {
            var i, ii=-1, iVars=[];
            for (i = 0; i <= schema.nJuncs; i++) {
                if (schema.juncs[i].iType !== 0 && schema.juncs[i].iOpt !== 0) {
                    var iv = GetNums(schema.juncs[i].iOpt);
                    nvars = iv.length;
                    if (nvars > 0) {
                        if (IsValidVar(iv[0])) {
                            ii = ii + 1;
                            iVars[ii] = [i, iv[0]];
                            if (nvars > 1) {
                                if (IsValidVar(iv[1])) {
                                    ii = ii + 1;
                                    iVars[ii] = [i, iv[1]];
                                }
                            }
                        }
                    }
                }
            }
            return iVars;
        }

        function GetNums(N) {
            var iZn, i0, i1;
            if (N < 0) { NN = Math.abs(N); iZn = -1 } else { NN = N; iZn = 1 }
            if (NN < 10) {
                return [N];
            } else {
                var i0 = parseInt(NN / 10);
                var i1 = NN - 10 * i0;
                return [iZn * i0, i1];
            }
        }

        function SetProject(LNs) {
            //document.getElementById('FileProjectOkno').value = localStorage.getItem('ProjectDat');
            var i, key;
            var SetupDat = '';
            var DesignDat = '';
            var MemoDat = '';
            var kod = -1;
            var n = LNs.length - 1;
            if (n < 0) { return; }
            for (i = 0; i <= n; i++) {
                var LN = LNs[i].trim();
                if (LN.length > 3) {
                    key = LNs[i].substr(0, 4);
                    //alert(key);
                    if (key == 'SETU') { kod = 1; }
                    if (key == 'DESI') { kod = 2; }
                    if (key == 'BACK') { kod = 3; }
                    if (kod == 1 && key != 'SETU') {
                        SetupDat += LNs[i] + '\r\n';
                    }
                    if (kod == 2 && key != 'DESI') {
                        DesignDat += LNs[i] + '\r\n';
                    }
                    if (kod == 3 && key != 'BACK') {
                        MemoDat += LNs[i] + '\r\n';
                    }

                }

            }
            if (kod > 0) {
                localStorage.setItem("InputDatFileText", SetupDat);
                localStorage.setItem("DesignFileText", DesignDat);
                localStorage.setItem("MemoDatText", MemoDat);
            }
