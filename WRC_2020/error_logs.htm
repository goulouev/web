        var MainSchema;

        function DesignLoad() {
            MainSchema = new design;
            //PrjFile0();
            if (localStorage.getItem('DesignFileText') === null) {
            //localStorage.setItem('DesignFileText', '');
            } else {
                var EditTxt = localStorage.getItem('DesignFileText');
                if (!EditTxt) { return; }
                PrjParts = SplitProjectParts(EditTxt);
                //var MainSchema = new design();
                if (!PrjParts[0]) { return; }
                if (!PrjParts[1]) { return; }
                MainSchema.ImportShapka(PrjParts[0]);
                MainSchema.ImportSchema(PrjParts[1]);
            }
            err_logs();
        }


        function err_logs() {
            var logs = document.getElementById('okno');
            var txt0, txt1, txt2, msg;
            var txt0 = MainSchema.ConnLogsExport();
            if (localStorage.getItem('InputDatFileText') === null) {
                ;
            } else {
                InDat.ImportFromText(localStorage.getItem('InputDatFileText'));
            }
            if (txt0) {
                txt = '<b>CONNECTIONS:</b><br/><br/>'
                txt = txt + txt0;
                document.write(txt);
                return;
            } else {
                txt = '<br/><b>SYMMETRY:</b><br/><br/>';
                txt1 = MainSchema.SymLogsExport();
                if (txt1) {
                    txt = txt  + txt1;
                } else {
                    txt = txt + '<font style="color:green">No errors</font ><br/>';
                }
                txt2 = MainSchema.DimLogsExport();
                txt = txt + '<br/><b>DIMENSIONS:</b><br/><br/>';
                if (txt2) {
                    txt = txt  + txt2;
                } else {
                    txt = txt + '<font style="color:green">No errors</font ><br/>';
                }
                logs.innerHTML = txt;

            }
        }

        function SetProject(LNs) {
            //document.getElementById('FileProjectOkno').value = localStorage.getItem('ProjectDat');
            var i, key;
            var SetupDat = '';
            var DesignDat = '';
            var MemoDat = '';
            var kod = -1;
            var n = LNs.length - 1;
            if (n < 0) { return; }
            for (i = 0; i <= n; i++) {
                var LN = trim(LNs[i]);
                if (LN.length > 3) {
                    key = LNs[i].substr(0, 4);
                    //alert(key);
                    if (key == 'SETU') { kod = 1; }
                    if (key == 'DESI') { kod = 2; }
                    if (key == 'BACK') { kod = 3; }
                    if (kod == 1 && key != 'SETU') {
                        SetupDat += LNs[i] + '\r\n';
                    }
                    if (kod == 2 && key != 'DESI') {
                        DesignDat += LNs[i] + '\r\n';
                    }
                    if (kod == 3 && key != 'BACK') {
                        MemoDat += LNs[i] + '\r\n';
                    }

                }

            }
            if (kod > 0) {
                localStorage.setItem("InputDatFileText", SetupDat);
                localStorage.setItem("DesignFileText", DesignDat);
                localStorage.setItem("MemoDatText", MemoDat);

            }
        }
        //############################
        function trim(str) {
            return str.replace(/^\s+|\s+$/g, '');
        }
