        // GRAPH SUPPORT FUNCTIONS  ################################################

        //GRAPH FRAME==================================
        function xFrame(xScale, xScale0, xScale1, xFrame0, xFrame1) {
            var xFrame = xFrame0 + (xFrame1 - xFrame0) / (xScale1 - xScale0) * (xScale - xScale0);
            if (xFrame < xFrame0) { xFrame = xFrame0 }
            if (xFrame > xFrame1) { xFrame = xFrame1 }
            return xFrame;
        }

        function yFrame(yScale, yScale0, yScale1, yFrame0, yFrame1) {
            var yFrame = yFrame0 + (yFrame1 - yFrame0) / (yScale1 - yScale0) * (yScale - yScale0);
            if (yFrame < yFrame0) { yFrame = yFrame0 }
            if (yFrame > yFrame1) { yFrame = yFrame1 }
            return yFrame;
        }


        function GraphFrame(xFrame0, yFrame0, xFrame1, yFrame1) {
            jg.clear();
            jg.setColor("#000000");
            jg.drawRect(0, 0, xCanvasMax, yCanvasMax);
            jg.paint();
        }

        function GraphGrid(xScale0, yScale0, xScale1, yScale1, xFrame0, yFrame0, xFrame1, yFrame1, nxGrid, nyGrid) {
            jg.setColor("#0084A5");
            jg.setFont("Arial Black", "10px", Font.PLAIN);
            var x, xF, xT, y, yT, yF;
            var nxx = Math.round(3.0 - Math.log(Math.max(Math.abs(xScale0), Math.abs(xScale1))) / Math.LN10);
            var nyy = Math.round(3.0 - Math.log(Math.max(Math.abs(yScale0), Math.abs(yScale1))) / Math.LN10);
            if (nxx < 0) { nxx = 0 }
            if (nyy < 0) { nyy = 0 }
            for (var i = 0; i <= nxGrid; i++) {
                x = xScale0 + (xScale1 - xScale0) * i / nxGrid;
                xT = x.toFixed(nxx);
                xF = xFrame(x, xScale0, xScale1, xFrame0, xFrame1);
                jg.drawLine(xF, yFrame0, xF, yFrame1); // co-ordinates related to "myCanvas"
                jg.drawString(xT, xF - 10, yFrame1 + 10);
            }
            for (var i = 0; i <= nyGrid; i++) {
                y = yScale0 + (yScale1 - yScale0) * i / nyGrid;
                yT = y.toFixed(nyy)
                yF = yFrame(y, yScale0, yScale1, yFrame0, yFrame1);
                jg.drawLine(xFrame0, yF, xFrame1, yF); // co-ordinates related to "myCanvas"
                jg.drawString(yT, xFrame0 - 45, yF - 7);
            }
            jg.paint();
        }

        // PLOT DRAW ===========================================

        function DrawPlot(iSample, SLines, xScale0, yScale0, xScale1, yScale1) {
            var x0 = parseFloat(Xscale0.value);
            var x1 = parseFloat(Xscale1.value);
            var y0 = parseFloat(Yscale1.value);
            var y1 = parseFloat(Yscale0.value);

            var xv;
            var iType = 1;
            for (i = 0; i <= 4; i++) {
                if (ReportFun[i].checked) { iType = i + 1; }
            }
            var Np = SLines.length - 2;
            //jg.setColor("#ff00dd"); // red
            for (iPort = 0; iPort <= 3; iPort++) {
                if (Path[iPort].checked) {
                    var Xp = new Array();
                    var Yp = new Array();
                    for (i = 0; i <= Np; i++) {
                        xv = vParam(iType, iPort, iSample, i, Np, SLines);
                        //UBERY HUJ OTSJUDA
                        Xp[i] = xFrame(xv[0], x0, x1, xFrame0, xFrame1);
                        Yp[i] = yFrame(xv[1], y0, y1, yFrame0, yFrame1);
                    }
                    jg.setColor(GrColor[iPort]);
                    jg.drawPolyline(Xp, Yp);
                    jg.paint();

                }
            }
        }

        function vParam(iType, iPort, iSample, iCount, Np, SLines) {
            var i = iCount
            if (iType > 1) {
                if (iCount < 1) { i = 1; }
                if (iCount > Np - 1) { i = Np - 1; }
            }
            var S = SLines[i].split(" ");
            var F = parseFloat(S[0]);
            var V = Array(parseFloat(S[2 * iPort + 1]), parseFloat(S[2 * iPort + 2]));
            if ((iType == 2) || (iType == 4) || (iType == 5)) {
                var S0 = SLines[i - iSample].split(" ");
                var S1 = SLines[i + iSample].split(" ");
                var F0 = S0[0];
                var F1 = S[0];
                var V0 = Array(S0[2 * iPort + 1], S0[2 * iPort + 2]);
                var V1 = Array(S1[2 * iPort + 1], S1[2 * iPort + 2]);
                var dF = (F1 - F0) / 2.0;
            }
            if (iType == 2) {
                var ILS = (dB(V1) - dB(V0)) / dF / 2000.0;
                return Array(F, ILS);
            }

            if (iType == 3) {
                return Array(F, DgRad * arg(V));
            }

            if (iType == 4) {
                var dW = DeltaArg(V1, V0);
                var dPdx = 0.5 * arg(dW) / dF;
                var GD = -dPdx / 2.0 / Math.PI;
                return Array(F, GD);
            }

            if (iType == 5) {
                var W1 = DeltaArg(V1, V);
                var W0 = DeltaArg(V, V0);
                ddPdx2 = arg(DeltaArg(W1, W0));
                var GDS = -0.001 * ddPdx2 / 2.0 / Math.PI;
                return Array(F, GDS);
            }
            return Array(F, dB(V));
        }

        function MiniMax(F0, F1, iSample, SLines) {
            var vMin = 1.e10;
            var vMax = -1.e10;
            var xv;
            var iType = 1;
            for (i = 0; i <= 4; i++) {
                if (ReportFun[i].checked) { iType = i + 1; }
            }
            var Np = SLines.length - 2;
            for (iPort = 0; iPort <= 3; iPort++) {
                if (Path[iPort].checked) {
                    for (i = 0; i <= Np; i++) {
                        xv = vParam(iType, iPort, iSample, i, Np, SLines);
                        if ((xv[0] >= F0) && (xv[0] <= F1)) {
                            if (xv[1] > vMax) { vMax = xv[1]; }
                            if (xv[1] < vMin) { vMin = xv[1]; }
                        }
                    }
                }
            }
            return Array(vMin, vMax);
        }







        //'=================== COMPLEX FUNCTION MATH

        function cmplx(x, y) {
            return Array(x, y);
        }

        function xpy(x, y) {
            return Array(x[0] + y[0], x[1] + y[1]);
        }

        function xmy(x, y) {
            return Array(x[0] - y[0], x[1] - y[1]);
        }

        function xoy(x, y) {
            return Array(x[0] * y[0] - x[1] * y[1], x[0] * y[1] + x[1] * y[0]);
        }

        function xdy(x, y) {
            var M = y[0] * y[0] + y[1] * y[1];
            return Array((x[0] * y[0] + x[1] * y[1]) / M, (-x[0] * y[1] + x[1] * y[0]) / M);
        }

        function cexp(x) {
            var a = Math.exp(x[0]);
            return Array(a * Math.cos(x[1]), a * Math.sin(x[1]));
        }

        function ax(a, x) {
            return Array(a * x[0], a * x[1]);
        }

        function cabs(x) {
            return Math.sqrt(x[0] * x[0] + x[1] * x[1]);
        }


        function arg(x) {
            var pi = 3.141592653589793238;
            var pi2 = 1.570796326794896619;
            var up = x[1] + x[0];
            var um = x[1] - x[0];
            if (up > 0 && um > 0) {
                return pi2 - Math.atan(x[0] / x[1]);
            }
            if (up >= 0 && um <= 0) {
                return Math.atan(x[1] / x[0]);
            }
            if (up < 0 && um < 0) {
                return -pi2 - Math.atan(x[0] / x[1]);
            }
            if (up <= 0 && um >= 0) {
                if (x[1] >= 0) {
                    return pi + Math.atan(x[1] / x[0]);
                }
                else {
                    return -pi + Math.atan(x[1] / x[0]);
                }
            }
            return 0.0;
        }

        function dB(x) {
            var R;
            R = cabs(x);
            if (R > 1E-20) {
                return 20. * Math.log(R) / Math.LN10;

            }
            else {
                return -400;
            }
        }

        function DeltaArg(x, y)
        //exp(i*(dPhase(x)-dPase(y)))
        {
            var M = cabs(x) * cabs(y);
            dT = Array((x[0] * y[0] + x[1] * y[1]) / M, (x[1] * y[0] - x[0] * y[1]) / M);
            return dT;
        }
