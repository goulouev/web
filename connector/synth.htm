if  Proto(1).Checked then

        VarName3.Value = "In-Band Ripple, dB"

if Proto(2).Checked then

        VarName3.Value = "Profile Parameter"

if Proto(3).Checked then
        VarName0.Value = ""
        VarName1.Value = "Reference Frequency, GHz"
        VarName2.Value = ""
        VarName3.Value = ""
        end if
End Sub

        Sub KnobExample_OnClick()
        if not(Proto(0).Checked or Proto(0).Checked or Proto(0).Checked) then
        Proto(1).checked = true
        call ProtoType()
        end if
if Proto(0).Checked then  Var0.Value = "0": Var1.Value = "12.2": Var2.Value = "0.50"   : end if
if Proto(1).Checked then  Var0.Value = "0": Var1.Value = "12.2": Var2.Value = "0.50" : Var3.Value = "0.05"  : end if
if Proto(2).Checked then Var3.Value = "0": Var1.Value = "12.2": Var2.Value = "2.0 3.5" : Var3.Value = "1.5" :  : end if
End Sub

        Sub KnobClear_OnClick()
        Var0.Value = "": Var1.Value = "": Var2.Value = "": Var3.Value = ""
        End Sub

        Sub KnobApply_OnClick()
        Dim Av(4)
        if Proto(0).Checked = true then Av(0) = "0"
        if Proto(1).Checked = true then Av(0) = "1"
        if Proto(2).Checked = true then Av(0) = "2"
        if Proto(3).Checked = true then Av(0) = "3"
        Av(1) = Var0.Value: Av(2) = Var1.Value: Av(3) = Var2.Value: Av(4) = Var3.Value
        Top.ProtoDat.Value = join(Av, "|")
        Window.Navigate "editor.htm"
        End Sub

        Sub ShowSpecs()
        Pars = Top.ProtoDat.Value
        Av = Split(Pars, "|")
        Npars = Ubound(Av)
        if Npars < 4 then exit sub
        if Av(0) = "0" then Proto(0).Checked = true
        if Av(0) = "1" then Proto(1).Checked = true
        if Av(0) = "2" then Proto(2).Checked = true
        if Av(0) = "3" then Proto(3).Checked = true
        Var0.Value = Av(1): Var1.Value = Av(2): Var2.Value = Av(3): Var3.Value = Av(4)
        call  ProtoType()
        End Sub
